# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bookea
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite incrusta esto en el bundle durante el build, asi que cambiar la URL
      # del script despues exige redesplegar. Si publicas una implementacion
      # nueva en Apps Script y la URL cambia, actualiza aqui.
      - key: VITE_API_URL
        value: https://script.google.com/macros/s/AKfycbzX8PIP_j_UNfQHb-nGwcEdQMGeZ7lYH4wWxLnP5G-bJwrSHQNwWBHed8XwINOMXFjG4g/exec
      # El token NO va en el repo: se carga en Render (Environment) con el valor que
      # da el menú "Generar token de la API" del Apps Script. sync: false = Render
      # lo pide al crear el servicio y nunca lo pisa desde este archivo.
      - key: VITE_API_TOKEN
        sync: false
      - key: VITE_WHATSAPP
        value: "584122516390"
      # WhatsApp de bookeaa: recibe las consultas y pruebas gratis de la landing.
      - key: VITE_BOOKEAA_WHATSAPP
        value: "584220298203"
      # Negocio al que entra quien abre la raiz del dominio, sin /u/<slug>.
      - key: VITE_DEFAULT_SHOP
        value: samuel-herrera
    routes:
      # /ar es una carpeta estatica (public/ar). Sin la barra final caeria en la app de React
      # (pasa lo mismo con /campana), asi que se manda directo a /ar/.
      - type: redirect
        source: /ar
        destination: /ar/
      # El negocio se saca de la ruta (/u/<slug>), asi que /u/samuel-herrera tiene
      # que servir la app aunque no exista ese archivo. Sin esto, 404. Los archivos
      # que si existen ganan sobre la regla, asi que /assets/* sigue sirviendo.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Seguridad para todo el sitio. El CSP de la app va como <meta> en index.html
      # (lo arma vite.config.ts); acá va lo que un <meta> no puede hacer.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # camera=(self): solo las paginas del propio sitio pueden pedir la camara (la usa /ar,
      # la tarjeta en realidad aumentada). Va en /* y no en una regla aparte para /ar porque
      # Render no documenta cual gana cuando dos reglas mandan la misma cabecera.
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Librerias de /ar (three.js y MindAR): la version va en el nombre de la carpeta.
      - path: /ar/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Con el rewrite, /u/* tambien devuelve index.html pero bajo otra ruta, asi
      # que la regla de arriba no le alcanza y el HTML podria quedar cacheado.
      - path: /u/*
        name: Cache-Control
        value: no-cache

