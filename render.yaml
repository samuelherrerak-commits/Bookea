# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mariana-nails
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://script.google.com/macros/s/AKfycbzX8PIP_j_UNfQHb-nGwcEdQMGeZ7lYH4wWxLnP5G-bJwrSHQNwWBHed8XwINOMXFjG4g/exec
      - key: VITE_API_TOKEN
        value: Bookeav1.1.1
      - key: VITE_WHATSAPP
        value: "584122516390"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
