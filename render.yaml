# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bookea
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite incrusta esto en el bundle durante el build, asi que cambiar la URL
      # del script despues exige redesplegar. Si publicas una implementacion
      # nueva en Apps Script y la URL cambia, actualiza aqui.
      - key: VITE_API_URL
        value: https://script.google.com/macros/s/AKfycbzX8PIP_j_UNfQHb-nGwcEdQMGeZ7lYH4wWxLnP5G-bJwrSHQNwWBHed8XwINOMXFjG4g/exec
      # Token del menú "Generar token de la API" del Apps Script. Tiene que ser el
      # mismo que guardó el script, o todo responde no_autorizado. No es secreto
      # (viaja en cada petición del navegador), pero si lo cambias, cámbialo aquí.
      - key: VITE_API_TOKEN
        value: bk_c7433c38c7484b698191c45079085af5a907d9d6
      - key: VITE_WHATSAPP
        value: "584122516390"
      # WhatsApp de bookeaa: recibe las consultas y pruebas gratis de la landing.
      - key: VITE_BOOKEAA_WHATSAPP
        value: "584120298203"
      # Negocio al que entra quien abre la raiz del dominio, sin /u/<slug>.
      - key: VITE_DEFAULT_SHOP
        value: samuel-herrera
    routes:
      # El negocio se saca de la ruta (/u/<slug>), asi que /u/samuel-herrera tiene
      # que servir la app aunque no exista ese archivo. Sin esto, 404. Los archivos
      # que si existen ganan sobre la regla, asi que /assets/* sigue sirviendo.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Seguridad para todo el sitio. El CSP de la app va como <meta> en index.html
      # (lo arma vite.config.ts); acá va lo que un <meta> no puede hacer.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Con el rewrite, /u/* tambien devuelve index.html pero bajo otra ruta, asi
      # que la regla de arriba no le alcanza y el HTML podria quedar cacheado.
      - path: /u/*
        name: Cache-Control
        value: no-cache

