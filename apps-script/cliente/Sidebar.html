<!doctype html>
<!--
  Ventana de configuración de bookeaa (se sigue llamando Sidebar.html para que en
  las hojas ya creadas baste con pegar el contenido nuevo). Configurador.gs la abre
  como diálogo grande con createTemplateFromFile: `inicio` elige la sección inicial.
-->
<html lang="es">
<head>
<base target="_top" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700&family=Newsreader:ital,wght@0,500;1,500&family=Source+Sans+3:wght@400;600&family=Nunito:wght@400;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Lato:wght@400;700&family=DM+Sans:wght@400;500&family=Fraunces:ital,wght@0,600;1,600&family=Figtree:wght@400;600&display=swap"
/>
<style>
  :root {
    --paper: #ffffff;
    --coal: #0f0f0e;
    --graphite: #5b5b57;
    --mist: #f4f4f2;
    --rule: #e3e3df;
    --ok: #1f7a4d;
    --danger: #b4371f;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--coal); }
  body { font: 14px/1.45 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header { padding: 16px 16px 10px; }
  .logo { font: 800 24px/1 'Barlow Condensed', sans-serif; letter-spacing: -0.01em; }
  .sub { color: var(--graphite); font-size: 13px; margin-top: 2px; }

  nav { display: flex; gap: 6px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; border-bottom: 1px solid var(--rule); }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; border: 1.5px solid var(--rule); background: var(--paper); border-radius: 999px;
    padding: 5px 11px; font: 700 13px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
    transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
  }
  nav button[aria-selected='true'] { background: var(--coal); color: var(--paper); border-color: var(--coal); }
  nav button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e0a100; margin-left: 5px; vertical-align: 2px; }

  main { padding: 16px 16px 120px; }
  section[hidden] { display: none; }
  h2 { font: 800 22px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; margin: 0 0 4px; }
  h3 { font: 700 15px/1.1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.06em; margin: 22px 0 8px; }
  .rule { width: 28px; height: 3px; background: var(--coal); margin: 8px 0 14px; }
  .hint { color: var(--graphite); font-size: 12.5px; margin: 4px 0 0; }

  label.field { display: block; margin-top: 12px; }
  label.field > span { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  input[type='text'], input[type='url'], input[type='number'], input[type='time'], input[type='tel'], select, textarea {
    width: 100%; border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 10px; background: var(--paper);
    transition: border-color 150ms var(--ease);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--coal); }
  textarea { min-height: 220px; resize: vertical; font: 13px/1.5 ui-monospace, 'SFMono-Regular', Menlo, monospace; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; min-width: 0; }

  .btn {
    border: 0; border-radius: 999px; background: var(--coal); color: var(--paper); padding: 9px 16px;
    font: 700 14px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
    transition: transform 120ms var(--ease), opacity 150ms var(--ease);
  }
  .btn:active { transform: scale(0.97); }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost { background: var(--paper); color: var(--coal); border: 1.5px solid var(--coal); }
  .btn.small { padding: 6px 11px; font-size: 12.5px; }
  .link { background: none; border: 0; padding: 0; color: var(--coal); text-decoration: underline; font-weight: 600; }
  .link.danger { color: var(--danger); }

  /* Estilos */
  .estilos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .estilo {
    border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); padding: 10px; text-align: left;
    transition: border-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .estilo:active { transform: scale(0.98); }
  .estilo[aria-pressed='true'] { border-color: var(--coal); box-shadow: inset 0 0 0 1px var(--coal); }
  .estilo .aa { font-size: 26px; line-height: 1; display: block; }
  .estilo .n { font: 700 12px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--graphite); margin-top: 6px; display: block; }

  .color { display: flex; gap: 8px; align-items: center; }
  .color input[type='color'] { width: 42px; height: 38px; border: 1.5px solid var(--rule); border-radius: 10px; padding: 3px; background: var(--paper); flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    border: 1.5px solid var(--rule); border-radius: 999px; background: var(--paper); padding: 4px 9px 4px 5px;
    display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px;
  }
  .chip.alerta { padding: 5px 11px; cursor: pointer; }
  .chip.alerta[aria-pressed='true'] { border-color: var(--coal); background: var(--coal); color: var(--paper); }
  .chip i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); display: inline-block; }

  /* Vista previa */
  .preview { border-radius: 16px; overflow: hidden; border: 1.5px solid var(--rule); margin-top: 16px; }
  .preview .top { padding: 16px 14px 12px; }
  .preview .wm { font-size: 15px; }
  .preview .kick { font-size: 11.5px; margin-top: 14px; }
  .preview .title { font-size: 30px; line-height: 1.02; margin-top: 4px; }
  .preview .card { margin: 0 14px 14px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .preview .card b { display: block; font-size: 13.5px; }
  .preview .card small { font-size: 11.5px; }
  .preview .agregar { border: 0; border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; }
  .contraste { font-size: 12px; margin-top: 6px; color: var(--graphite); }

  /* Sedes y horarios */
  .item { border: 1.5px solid var(--rule); border-radius: 12px; padding: 10px; margin-top: 8px; }
  .item .row + .row, .item label.field { margin-top: 8px; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--coal); }
  .dia { border-bottom: 1px solid var(--rule); padding: 10px 0; }
  .dia .cab { display: flex; justify-content: space-between; align-items: center; }
  .dia .cab strong { font: 700 15px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .tramo { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
  .tramo span { color: var(--graphite); font-size: 12px; }
  .tramo input { min-width: 0; padding: 6px 6px; font-size: 13px; }

  /* Mensaje */
  .plantillas { display: flex; flex-direction: column; gap: 6px; }
  .plantilla {
    display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--rule); border-radius: 10px;
    padding: 8px 10px; background: var(--paper); text-align: left;
  }
  .plantilla[aria-pressed='true'] { border-color: var(--coal); box-shadow: inset 0 0 0 1px var(--coal); }
  .plantilla .usada { font: 700 11px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; background: var(--coal); color: var(--paper); border-radius: 999px; padding: 3px 7px; }
  .vars { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .vars button { border: 1px solid var(--rule); background: var(--mist); border-radius: 6px; padding: 2px 6px; font: 12px ui-monospace, Menlo, monospace; }
  .burbuja {
    background: #dcf8c6; color: #111b21; border-radius: 12px 12px 12px 4px; padding: 10px 12px; margin-top: 10px;
    white-space: pre-wrap; word-break: break-word; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
    box-shadow: 0 1px 1px rgb(0 0 0 / 0.08);
  }
  .fondo-chat { background: #efeae2; border-radius: 14px; padding: 10px; margin-top: 10px; }

  /* Pie */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule);
    padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  #estado { font-size: 12.5px; color: var(--graphite); min-height: 18px; }
  #estado.ok { color: var(--ok); }
  #estado.error { color: var(--danger); }
  .aviso { background: #fff4d6; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .errores { background: #fdecea; color: var(--danger); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 0; }
  .errores li { margin-left: 14px; }
  /* Código QR */
  .plantillas-qr { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .plantilla-qr {
    border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); padding: 10px; text-align: left;
    transition: border-color 150ms var(--ease), transform 120ms var(--ease);
  }
  .plantilla-qr:active { transform: scale(0.98); }
  .plantilla-qr[aria-pressed='true'] { border-color: var(--coal); box-shadow: inset 0 0 0 1px var(--coal); }
  .plantilla-qr b { display: block; font: 700 14px/1.1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  .plantilla-qr small { color: var(--graphite); font-size: 12px; }
  .lienzo { border: 1.5px solid var(--rule); border-radius: 14px; background: var(--mist); padding: 12px; display: grid; place-items: center; }
  .lienzo canvas { max-width: 100%; max-height: min(460px, 56vh); width: auto; height: auto; box-shadow: 0 6px 24px rgb(0 0 0 / 0.12); border-radius: 4px; }
  .acciones-qr { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  /* Ventana grande: menú a la izquierda, contenido al centro, vista previa a la derecha. */
  @media (min-width: 860px) {
    html, body { height: 100%; }
    body { overflow: hidden; }
    .app { display: grid; grid-template-columns: 230px minmax(0, 1fr); height: 100vh; }
    .lado { border-right: 1px solid var(--rule); background: var(--mist); overflow: auto; }
    .lado header { padding: 24px 20px 16px; }
    .lado .logo { font-size: 30px; }
    nav { flex-direction: column; border-bottom: 0; padding: 4px 12px 20px; gap: 4px; overflow: visible; }
    nav button {
      text-align: left; border-radius: 10px; border-color: transparent; background: transparent;
      padding: 11px 12px; font-size: 16px;
    }
    nav button:not([aria-selected='true']):hover { background: var(--paper); }
    nav button[aria-selected='true'] { background: var(--coal); color: var(--paper); }
    .centro { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    main { flex: 1; overflow: auto; padding: 30px 40px 40px; }
    main > section, main > .aviso, main > .errores { max-width: 1040px; }
    h2 { font-size: 30px; }
    footer { position: static; flex-direction: row-reverse; align-items: center; justify-content: space-between; padding: 12px 40px; }
    footer .row { flex: none; }
    .con-vista { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 36px; align-items: start; }
    .con-vista .vista { position: sticky; top: 0; }
    .con-vista .vista > h3:first-child { margin-top: 0; }
    .estilos { grid-template-columns: repeat(4, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-inicio="<?= inicio ?>">
<div class="app">
  <aside class="lado">
    <header>
      <div class="logo">bookeaa</div>
      <div class="sub">Configura tu página de reservas</div>
    </header>
    <nav id="tabs" role="tablist" aria-label="Secciones"></nav>
  </aside>
  <div class="centro">
    <main id="main"><p class="hint">Cargando tu configuración…</p></main>
    <footer>
      <div class="row">
        <button class="btn" id="guardar" type="button" disabled>Guardar</button>
        <a class="btn ghost small" id="ver" target="_blank" rel="noopener" style="flex:none;text-align:center;text-decoration:none;display:none">Ver página</a>
      </div>
      <div id="estado" role="status" aria-live="polite"></div>
    </footer>
  </div>
</div>

<script id="qr-lib">
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// DENSO WAVE INCORPORATED

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('

  function comprimirLogo(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) return reject(new Error('El archivo tiene que ser una imagen (PNG o JPG).'));
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('No pudimos leer esa imagen. Prueba con otra.')); };
      img.onload = function () {
        URL.revokeObjectURL(url);
        var lados = [320, 256, 200, 160];
        for (var i = 0; i < lados.length; i++) {
          var k = Math.min(1, lados[i] / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * k));
          c.height = Math.max(1, Math.round(img.naturalHeight * k));
          var ctx = c.getContext('2d');
          ctx.clearRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          var dato = c.toDataURL('image/webp', 0.9);
          if (dato.indexOf('data:image/webp') !== 0) dato = c.toDataURL('image/png');
          if (dato.length <= LOGO_MAX) return resolve(dato);
        }
        reject(new Error('La imagen es muy pesada. Prueba con un PNG más simple o recórtala.'));
      };
      img.src = url;
    });
  }

  // ---------- Código QR ----------

  /** Parte un texto en renglones que quepan en `max` píxeles. */
  function renglones(ctx, texto, max) {
    var palabras = String(texto || '').split(/\s+/).filter(Boolean);
    var lineas = [];
    var actual = '';
    palabras.forEach(function (p) {
      var prueba = actual ? actual + ' ' + p : p;
      if (ctx.measureText(prueba).width <= max || !actual) actual = prueba;
      else { lineas.push(actual); actual = p; }
    });
    if (actual) lineas.push(actual);
    return lineas;
  }

  /** Achica la fuente hasta que el texto quepa en una línea (un link no se puede partir). */
  function fuenteQueCabe(ctx, texto, fuente, px, max) {
    var t = px;
    do { ctx.font = fuente(t); t -= 1; } while (ctx.measureText(texto).width > max && t > 10);
    return ctx.font;
  }

  function rectRedondo(ctx, x, y, w, alto, r) {
    r = Math.min(r, w / 2, alto / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + alto, r);
    ctx.arcTo(x + w, y + alto, x, y + alto, r);
    ctx.arcTo(x, y + alto, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /** Matriz del QR (null si el link no sirve). */
  function matrizQr(url) {
    if (!/^https?:\/\/\S+$/i.test(url || '')) return null;
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    var qr = qrcode(0, 'M');
    qr.addData(url, 'Byte');
    qr.make();
    return qr;
  }

  /** Dibuja el QR en un cuadrado de `lado` px con 4 módulos de margen, en celdas enteras (sin bordes borrosos). */
  function pintarModulos(ctx, qr, x, y, lado, color) {
    var n = qr.getModuleCount();
    var cel = Math.floor(lado / (n + 8));
    var real = cel * (n + 8);
    var ox = Math.round(x + (lado - real) / 2) + cel * 4;
    var oy = Math.round(y + (lado - real) / 2) + cel * 4;
    ctx.fillStyle = color;
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(ox + c * cel, oy + r * cel, cel, cel);
    }
  }

  /** Dibuja la pieza completa. Devuelve un aviso (texto) o '' si salió bien. */
  function dibujarQr(canvas, q) {
    var p = L.PLANTILLAS_QR.filter(function (x) { return x.id === q.plantilla; })[0];
    var e = L.ESTILOS.filter(function (x) { return x.id === (cfg('tema_estilo') || 'elegante'); })[0] || L.ESTILOS[0];
    var col = L.coloresQr(S.datos.config, q.modo);
    var W = p.ancho, H = p.alto;
    var fDisplay = function (px) { return e.peso + ' ' + Math.round(px) + "px '" + e.display + "', serif"; };
    var fSans = function (px, peso) { return (peso || 400) + ' ' + Math.round(px) + "px '" + e.sans + "', sans-serif"; };
    var cargas = [fDisplay(40), fSans(40), fSans(40, 600)].map(function (f) { return document.fonts.load(f).catch(function () {}); });
    return Promise.all(cargas).then(function () {
      canvas.width = W;
      canvas.height = H;
      var ctx = canvas.getContext('2d');
      var qr = matrizQr(q.enlace);
      var t = q.textos[p.id];
      var nombre = cfg('marca') || cfg('nombre_negocio');
      var mayus = function (s) { return e.mayus ? String(s).toUpperCase() : s; };
      var linkVisible = String(q.enlace || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
      var radio = Math.max(8, e.radio) * (W / 400);

      if (p.id === 'solo') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, W, H);
        if (qr) pintarModulos(ctx, qr, 0, 0, W, col.modulos);
        return qr ? '' : 'Escribe un link que empiece con https:// para generar el código.';
      }

      ctx.fillStyle = col.fondo;
      ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'alphabetic';

      if (p.id === 'tarjeta') {
        var ladoT = Math.round(H * 0.78);
        var xq = Math.round(H * 0.11), yq = Math.round((H - ladoT) / 2);
        ctx.fillStyle = col.tarjeta;
        rectRedondo(ctx, xq, yq, ladoT, ladoT, radio * 0.6);
        ctx.fill();
        if (qr) pintarModulos(ctx, qr, xq, yq, ladoT, col.modulos);
        var x = xq + ladoT + Math.round(H * 0.1), ancho = W - x - Math.round(H * 0.1);
        var bloques = [];
        if (q.mostrarNombre && nombre) bloques.push({ f: fDisplay(H * 0.11), c: col.texto, s: mayus(nombre), gap: H * 0.05 });
        if (t.titulo) bloques.push({ f: fSans(H * 0.07, 600), c: col.texto, s: t.titulo, gap: H * 0.02 });
        if (t.subtitulo) bloques.push({ f: fSans(H * 0.055), c: col.suave, s: t.subtitulo, gap: H * 0.05 });
        if (q.mostrarLink && linkVisible) {
          var fLink = fuenteQueCabe(ctx, linkVisible, function (px) { return fSans(px, 600); }, H * 0.045, ancho);
          bloques.push({ f: fLink, c: col.texto, s: linkVisible, gap: 0 });
        }
        var alto = 0;
        bloques.forEach(function (b) {
          ctx.font = b.f;
          b.lineas = renglones(ctx, b.s, ancho);
          b.lh = parseInt(b.f.split(' ')[1], 10) * 1.15;
          alto += b.lineas.length * b.lh + b.gap;
        });
        var y = (H - alto) / 2;
        ctx.textAlign = 'left';
        bloques.forEach(function (b) {
          ctx.font = b.f;
          ctx.fillStyle = b.c;
          b.lineas.forEach(function (l) { y += b.lh; ctx.fillText(l, x, y - b.lh * 0.2); });
          y += b.gap;
        });
        return qr ? '' : 'Escribe un link que empiece con https:// para generar el código.';
      }

      // Vertical: nombre, título, texto, tarjeta con el QR, frase destacada y link.
      var margen = W * 0.08, ancho = W - margen * 2;
      // La historia es alta y se ve en el celular: textos y código más grandes.
      var escala = (W / 1080) * (p.id === 'historia' ? 1.22 : 1);
      var bloquesArriba = [];
      if (q.mostrarNombre && nombre) bloquesArriba.push({ f: fDisplay(46 * escala), c: col.texto, s: mayus(nombre), gap: 40 * escala });
      if (t.titulo) bloquesArriba.push({ f: fDisplay((p.id === 'historia' ? 118 : 96) * escala), c: col.texto, s: mayus(t.titulo), gap: 22 * escala, lh: 1.02 });
      if (t.subtitulo) bloquesArriba.push({ f: fSans(38 * escala), c: col.suave, s: t.subtitulo, gap: 0 });
      var alto = 0;
      bloquesArriba.forEach(function (b) {
        ctx.font = b.f;
        b.lineas = renglones(ctx, b.s, ancho);
        b.lh = parseInt(b.f.split(' ')[1], 10) * (b.lh || 1.2);
        alto += b.lineas.length * b.lh + b.gap;
      });
      var pastilla = t.llamado ? { f: fSans(36 * escala, 600), s: t.llamado } : null;
      var link = q.mostrarLink && linkVisible ? { f: fSans(32 * escala, 600), s: linkVisible } : null;
      var marca = { f: fSans(24 * escala), s: 'Reservas online con bookeaa' };
      var altoAbajo = (pastilla ? 96 * escala : 0) + (link ? 64 * escala : 0);
      var espacio = 60 * escala;
      var libre = H - margen * 2 - 60 * escala; // 60: el pie con la marca
      var lado = Math.min(ancho * (p.id === 'historia' ? 0.86 : 0.78), libre - alto - altoAbajo - espacio * 2);
      lado = Math.max(lado, W * 0.4);
      var total = alto + espacio + lado + espacio + altoAbajo;
      var y = margen + Math.max(0, (libre - total) / 2);
      ctx.textAlign = 'center';
      bloquesArriba.forEach(function (b) {
        ctx.font = b.f;
        ctx.fillStyle = b.c;
        b.lineas.forEach(function (l) { y += b.lh; ctx.fillText(l, W / 2, y - b.lh * 0.18); });
        y += b.gap;
      });
      y += espacio;
      var xq = (W - lado) / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      ctx.shadowBlur = 40 * escala;
      ctx.shadowOffsetY = 12 * escala;
      ctx.fillStyle = col.tarjeta;
      rectRedondo(ctx, xq, y, lado, lado, radio);
      ctx.fill();
      ctx.restore();
      if (qr) pintarModulos(ctx, qr, xq, y, lado, col.modulos);
      y += lado + espacio;
      if (pastilla) {
        fuenteQueCabe(ctx, pastilla.s, function (px) { return fSans(px, 600); }, 36 * escala, ancho - 80 * escala);
        var ap = Math.min(ancho, ctx.measureText(pastilla.s).width + 80 * escala), hp = 76 * escala;
        ctx.fillStyle = col.acento;
        rectRedondo(ctx, (W - ap) / 2, y, ap, hp, hp / 2);
        ctx.fill();
        ctx.fillStyle = col.sobreAcento;
        ctx.textBaseline = 'middle';
        ctx.fillText(pastilla.s, W / 2, y + hp / 2 + 2 * escala);
        ctx.textBaseline = 'alphabetic';
        y += 96 * escala;
      }
      if (link) {
        fuenteQueCabe(ctx, link.s, function (px) { return fSans(px, 600); }, 32 * escala, ancho);
        ctx.fillStyle = col.texto;
        ctx.fillText(link.s, W / 2, y + 44 * escala);
      }
      ctx.font = marca.f;
      ctx.fillStyle = col.suave;
      ctx.globalAlpha = 0.8;
      ctx.fillText(marca.s, W / 2, H - margen * 0.6);
      ctx.globalAlpha = 1;
      return qr ? '' : 'Escribe un link que empiece con https:// para generar el código.';
    });
  }

  function descargarQr(canvas, q) {
    var base = String(cfg('slug') || cfg('marca') || cfg('nombre_negocio') || 'mi-negocio')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    canvas.toBlob(function (blob) {
      if (!blob) { estado('No se pudo crear la imagen.', 'error'); return; }
      var url = URL.createObjectURL(blob);
      var a = h('a', { href: url, download: 'qr-' + (base || 'negocio') + '-' + q.plantilla + '.png' });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      estado('Listo: revisa tus descargas.', 'ok');
    }, 'image/png');
  }

  // ---------- Guardar ----------
  var CLAVES = {
    marca: ['nombre_negocio', 'marca', 'logo_url', 'hero_titulo', 'hero_subtitulo'],
    estilo: ['tema_estilo', 'color_principal', 'color_fondo', 'paleta'],
    lugar: ['lugar_tipo', 'lugar_nombre', 'permite_domicilio', 'recargo_domicilio_pct', 'minutos_extra_domicilio'],
    mensaje: ['mensaje_plantilla'],
    horario: ['intervalo_min', 'dias_anticipacion', 'anticipacion_min_horas', 'zona_horaria', 'recordatorio_minutos'],
    pagos: ['whatsapp', 'moneda', 'metodos_pago', 'pm_banco', 'pm_telefono', 'pm_cedula', 'tasa_eur_manual', 'tasa_usd_manual'],
    comprobantes: ['facturacion_modo', 'facturacion_rif', 'facturacion_razon_social', 'facturacion_proveedor'],
  };
  function paquete(seccion) {
    var c = {};
    CLAVES[seccion].forEach(function (k) { if (k in S.datos.config) c[k] = S.datos.config[k]; });
    var p = { config: c };
    if (seccion === 'lugar') p.sedes = S.datos.sedes;
    if (seccion === 'mensaje') p.mensajes = S.datos.mensajes;
    if (seccion === 'horario') p.horarios = S.datos.horarios;
    return p;
  }
  function guardarTodo() {
    var pendientes = SECCIONES.map(function (s) { return s.id; }).filter(function (id) { return S.sucias[id]; });
    if (!pendientes.length || S.guardando) return;
    S.guardando = true;
    var btn = document.getElementById('guardar');
    btn.disabled = true;
    estado('Guardando…', '');
    var refrescada = true;
    (function siguiente() {
      var seccion = pendientes.shift();
      if (!seccion) {
        S.guardando = false;
        estado(refrescada ? 'Guardado. Tu página ya muestra los cambios.' : 'Guardado. Tu página lo mostrará en unos minutos.', 'ok');
        return;
      }
      google.script.run
        .withSuccessHandler(function (r) {
          if (!r.ok) {
            S.guardando = false;
            btn.disabled = false;
            S.activa = seccion;
            pintarTabs(); pintar();
            var box = h('ul', { class: 'errores' }, r.errores.map(function (e) { return h('li', { text: e }); }));
            document.getElementById('main').prepend(box);
            estado('No se guardó ' + seccion + ': revisa lo marcado arriba.', 'error');
            return;
          }
          refrescada = refrescada && r.refrescada;
          delete S.sucias[seccion];
          pintarTabs();
          siguiente();
        })
        .withFailureHandler(function (err) { S.guardando = false; btn.disabled = false; fallo(err); })
        .guardar(seccion, paquete(seccion));
    })();
  }
  function fallo(err) { estado('Algo salió mal: ' + (err && err.message ? err.message : err), 'error'); }

  document.getElementById('guardar').addEventListener('click', guardarTodo);
  window.addEventListener('beforeunload', function (e) {
    if (Object.keys(S.sucias).length) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Arranque ----------
  pintarTabs();
  google.script.run
    .withSuccessHandler(function (datos) {
      S.datos = datos;
      if (!S.datos.sedes.length) S.datos.sedes.push({ nombre: '', direccion: '', mapsUrl: '', activa: true });
      if (datos.paginaUrl) {
        var ver = document.getElementById('ver');
        ver.href = datos.paginaUrl;
        ver.style.display = '';
      }
      pintar();
    })
    .withFailureHandler(fallo)
    .leerTodo();
})();
</script>
</body>
</html>
