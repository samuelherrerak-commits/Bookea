<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>bookeaa · tarjetas de presentación</title>
<script src="../../node_modules/qrcode-generator/dist/qrcode.js"></script>
<style>
  /*
   * Tarjetas de 90 × 50 mm con 3 mm de sangrado por lado: cada cara mide 96 × 56 mm.
   * Todo en mm. Zona segura: 4 mm hacia adentro del corte (7 mm desde el borde del archivo).
   */
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url('../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 400; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 500; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2') format('woff2'); }

  @page { size: 96mm 56mm; margin: 0; }
  :root { --coal: #0f0f0e; --paper: #ffffff; --mist: #f1f1ef; --graphite: #5b5b57; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9d9d6; }
  body.imprimir, body.sola { background: none; }

  .cara {
    position: relative; width: 96mm; height: 56mm; overflow: hidden;
    font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; break-after: page;
  }
  .negra { background: var(--coal); color: var(--paper); }
  .blanca { background: var(--paper); color: var(--coal); }
  .abs { position: absolute; }
  .cond { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  .kicker { font: 700 2.1mm/1 'Barlow Condensed', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; }

  .logo { display: flex; align-items: center; gap: 1.2mm; font: 800 5mm/1 'Barlow Condensed', sans-serif; letter-spacing: -0.01em; }
  .logo svg { width: 4.6mm; height: 4.6mm; }

  .qr { background: var(--paper); border-radius: 2mm; display: grid; place-items: center; }
  .qr svg { display: block; }

  .esq { position: absolute; width: 4mm; height: 4mm; border: 0 solid currentColor; }
  .esq.a { border-top-width: 0.45mm; border-left-width: 0.45mm; }
  .esq.b { border-top-width: 0.45mm; border-right-width: 0.45mm; }
  .esq.c { border-bottom-width: 0.45mm; border-left-width: 0.45mm; }
  .esq.d { border-bottom-width: 0.45mm; border-right-width: 0.45mm; }

  .contacto { font: 700 3.3mm/1 'Barlow Condensed', sans-serif; letter-spacing: 0.02em; display: flex; align-items: center; gap: 1mm; }
  .contacto svg { width: 3.2mm; height: 3.2mm; }
  .web { font: 500 2.25mm/1 'Barlow', sans-serif; letter-spacing: 0.01em; }
  .pastilla { display: inline-block; border-radius: 99mm; padding: 1.1mm 2.6mm; font: 800 3mm/1 'Barlow Condensed', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }

  .notif {
    display: grid; grid-template-columns: 5.2mm 1fr auto; gap: 1.6mm; align-items: center;
    background: var(--mist); border-radius: 2.6mm; padding: 1.5mm 2mm; width: 50mm;
  }
  .notif .ico { width: 5.2mm; height: 5.2mm; border-radius: 1.3mm; background: var(--coal); display: grid; place-items: center; }
  .notif .ico svg { width: 3.4mm; height: 3.4mm; }
  .notif b { display: block; font: 600 2.35mm/1.2 'Barlow', sans-serif; }
  .notif span { display: block; font: 400 2.1mm/1.2 'Barlow', sans-serif; color: var(--graphite); }
  .notif time { font: 400 1.8mm/1 'Barlow', sans-serif; color: var(--graphite); align-self: start; }

  /* Vista previa: las caras recortadas a 90 × 50 mm, como quedan impresas. */
  body.preview { padding: 0; }
  body.preview #raiz { display: grid; gap: 9mm; padding: 6mm; }
  .fila { display: flex; gap: 8mm; align-items: center; }
  .fila h2 { font: 800 5mm/1 'Barlow Condensed', sans-serif; text-transform: uppercase; width: 34mm; color: var(--coal); }
  .fila h2 small { display: block; font: 500 2.6mm/1.3 'Barlow', sans-serif; text-transform: none; color: var(--graphite); margin-top: 1.5mm; }
  .recorte { width: 90mm; height: 50mm; overflow: hidden; border-radius: 1.2mm; box-shadow: 0 1.5mm 5mm rgb(0 0 0 / 0.22); }
  .recorte .cara { margin: -3mm; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  const LANDING = 'https://bookeaa.com'
  const WHATSAPP = '+58 422 029 8203'
  const WEB = 'bookeaa.com'

  const logoSvg = (claro) => {
    const fg = claro ? '#ffffff' : '#0f0f0e', bg = claro ? '#0f0f0e' : '#ffffff'
    return `<svg viewBox="0 0 32 32"><rect x="2" y="4" width="28" height="26" rx="7" fill="${fg}"/><path d="M10 2.5v5M22 2.5v5" stroke="${fg}" stroke-width="2.6" stroke-linecap="round"/><path d="M12 11v12M12 17.5a4 4 0 1 1 0 .01" stroke="${bg}" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>`
  }
  const logo = (claro, mm = 5) => `<div class="logo" style="font-size:${mm}mm">${logoSvg(claro).replace('<svg', `<svg style="width:${mm * 0.92}mm;height:${mm * 0.92}mm"`)}bookeaa</div>`
  const wa = `<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg>`

  /** QR vectorial: un solo <path>, módulos negros, 4 módulos de margen blanco. */
  function qrSvg(lado) {
    const qr = qrcode(0, 'M')
    qr.addData(LANDING)
    qr.make()
    const n = qr.getModuleCount(), total = n + 8
    let d = ''
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`
    return `<svg viewBox="0 0 ${total} ${total}" style="width:${lado}mm;height:${lado}mm" shape-rendering="crispEdges"><rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#0f0f0e"/></svg>`
  }
  const esquinas = (x, y, w, h) => `
    <i class="esq a" style="left:${x}mm;top:${y}mm"></i><i class="esq b" style="left:${x + w - 4}mm;top:${y}mm"></i>
    <i class="esq c" style="left:${x}mm;top:${y + h - 4}mm"></i><i class="esq d" style="left:${x + w - 4}mm;top:${y + h - 4}mm"></i>`
  const notif = (titulo, texto, hora, estilo = '') => `
    <div class="notif abs" style="${estilo}"><div class="ico">${logoSvg(true)}</div><div><b>${titulo}</b><span>${texto}</span></div><time>${hora}</time></div>`

  // Coordenadas en mm sobre la cara de 96 × 56 (corte en 3–93 × 3–53; zona segura 7–89 × 7–49).
  const TARJETAS = [
    {
      nombre: 'Sin libreta',
      nota: 'La más directa: el problema al frente, la oferta atrás.',
      frente: { fondo: 'negra', html: `
        <div class="abs cond" style="left:8mm;top:8.5mm;font:800 12.2mm/0.84 'Barlow Condensed';letter-spacing:-0.01em">Tu agenda,<br>sin libreta.</div>
        <div class="abs" style="left:8mm;bottom:8mm">${logo(true, 5)}</div>
        <div class="abs kicker" style="right:8mm;bottom:8.8mm;opacity:.7">Reservas online</div>` },
      dorso: { fondo: 'blanca', html: `
        <div class="abs qr" style="left:6mm;top:6.5mm;width:30mm;height:30mm">${qrSvg(30)}</div>
        <div class="abs kicker" style="left:7.5mm;top:38.5mm;width:27mm;text-align:center">Escanéame</div>
        <div class="abs" style="left:40mm;top:8mm;right:7mm">
          <div class="kicker" style="color:#5b5b57">Pruébalo</div>
          <div class="cond" style="font:800 8.6mm/0.9 'Barlow Condensed';margin-top:1mm">1 mes gratis</div>
          <div style="font:500 2.5mm/1.3 Barlow;margin-top:1mm">Después <b>$15 al mes</b>, todo incluido.</div>
          <div style="font:500 2.3mm/1.55 Barlow;margin-top:1.8mm">✓ Tus clientes reservan 24/7<br>✓ Todo en tu Google Calendar<br>✓ Te llega por WhatsApp</div>
        </div>
        <div class="abs contacto" style="left:40mm;bottom:11.6mm">${wa}${WHATSAPP}</div>
        <div class="abs web" style="left:40mm;bottom:7.6mm">${WEB}</div>` },
    },
    {
      nombre: 'Minimal',
      nota: 'La más limpia: la marca sola al frente, todo lo demás atrás.',
      frente: { fondo: 'blanca', html: `
        ${esquinas(7, 7, 82, 42)}
        <div class="abs" style="left:0;right:0;top:19mm;display:grid;place-items:center">${logo(false, 10.5)}</div>
        <div class="abs kicker" style="left:0;right:0;top:33mm;text-align:center;font-size:2.4mm;letter-spacing:0.32em">Tu agenda online</div>` },
      dorso: { fondo: 'negra', html: `
        <div class="abs cond" style="left:8mm;top:8.5mm;width:46mm;font:800 6.6mm/0.92 'Barlow Condensed'">Reservas online para tu negocio.</div>
        <div class="abs" style="left:8mm;top:26mm;width:46mm;font:500 2.3mm/1.45 Barlow;opacity:.75">Barberías · Uñas · Consultorios<br>Estética · Spa · Tatuajes</div>
        <div class="abs contacto" style="left:8mm;bottom:11.6mm">${wa}${WHATSAPP}</div>
        <div class="abs web" style="left:8mm;bottom:7.6mm;opacity:.8">${WEB}</div>
        <div class="abs qr" style="right:7mm;top:9mm;width:29mm;height:29mm">${qrSvg(27)}</div>
        <div class="abs kicker" style="right:7mm;top:40.5mm;width:29mm;text-align:center">1 mes gratis</div>` },
    },
    {
      nombre: 'Nueva reserva',
      nota: 'La más llamativa: muestra cómo le llegan las citas.',
      frente: { fondo: 'blanca', html: `
        <div class="abs cond" style="left:8mm;top:8mm;font:800 7mm/0.88 'Barlow Condensed'">Tus clientes<br>reservan solos.</div>
        ${notif('Nueva reserva · Corte y barba', 'Hoy · 10:30 a. m.', 'ahora', 'left:8mm;top:23mm;')}
        ${notif('Nueva reserva · Manicure', 'Mañana · 4:00 p. m.', '23:04', 'left:12mm;top:33.5mm;opacity:.55;transform:scale(.94);transform-origin:left top')}
        <div class="abs" style="right:8mm;bottom:8mm">${logo(false, 4.6)}</div>` },
      dorso: { fondo: 'negra', html: `
        <div class="abs qr" style="left:7mm;top:9mm;width:29mm;height:29mm">${qrSvg(27)}</div>
        <div class="abs kicker" style="left:7mm;top:40.5mm;width:29mm;text-align:center">Mira cómo funciona</div>
        <div class="abs" style="left:41mm;top:8.5mm;right:7mm">
          <div class="cond" style="font:800 6.4mm/0.9 'Barlow Condensed'">Escanea y<br>pruébalo gratis.</div>
          <div class="pastilla" style="background:#fff;color:#0f0f0e;margin-top:2.6mm">1 mes gratis</div>
          <div style="font:500 2.3mm/1.3 Barlow;margin-top:1.6mm;opacity:.8">Después $15/mes · sin tarjeta</div>
        </div>
        <div class="abs contacto" style="left:41mm;bottom:11.6mm">${wa}${WHATSAPP}</div>
        <div class="abs web" style="left:41mm;bottom:7.6mm;opacity:.8">${WEB}</div>` },
    },
  ]

  const cara = (c) => `<section class="cara ${c.fondo}">${c.html}</section>`
  const q = new URLSearchParams(location.search)
  const raiz = document.getElementById('raiz')
  if (q.has('t')) {
    const t = TARJETAS[Number(q.get('t')) - 1]
    if (q.get('cara')) { document.body.className = 'sola'; raiz.innerHTML = cara(t[q.get('cara')]) }
    else { document.body.className = 'imprimir'; raiz.innerHTML = cara(t.frente) + cara(t.dorso) }
  } else {
    document.body.className = 'preview'
    raiz.innerHTML = TARJETAS.map((t, i) => `
      <div class="fila"><h2>${i + 1}. ${t.nombre}<small>${t.nota}</small></h2>
        <div class="recorte">${cara(t.frente)}</div><div class="recorte">${cara(t.dorso)}</div></div>`).join('')
  }
  window.listo = document.fonts.ready
</script>
</body>
</html>
