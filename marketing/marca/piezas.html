<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>bookeaa · piezas de redes</title>
<link rel="stylesheet" href="../video/estilos.css" />
<script src="../../node_modules/qrcode-generator/dist/qrcode.js"></script>
<script src="marca.js"></script>
<style>
  html, body { background: transparent; }
  body.preview { background: #222; padding: 30px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  body.preview .pieza { zoom: 0.25; }
  .pieza { position: relative; overflow: hidden; flex: none; }
  .negra { background: var(--coal); color: var(--paper); }
  .blanca { background: var(--paper); color: var(--coal); }
  .transparente { background: transparent; color: var(--coal); }
  .centro { display: grid; place-items: center; }
  .cond { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: -0.012em; }

  /* Historias (1080 × 1920): arriba ~250 px y abajo ~300 px las tapa Instagram. */
  .historia { width: 1080px; height: 1920px; padding: 270px 90px 0; }
  .historia .kicker { font-size: 38px; margin-bottom: 30px; }
  .historia .grande { font-size: 132px; }
  .historia .texto { font-size: 44px; margin-top: 40px; }
  .historia .regla { margin-top: 44px; }
  .lista { list-style: none; margin-top: 44px; display: grid; gap: 26px; }
  .lista li { display: flex; gap: 26px; align-items: flex-start; font: 500 46px/1.25 'Barlow', sans-serif; }
  .lista li b { font: 800 46px/1 'Barlow Condensed', sans-serif; flex: none; width: 56px; height: 56px; border-radius: 50%; border: 4px solid currentColor; display: grid; place-items: center; font-size: 32px; margin-top: 2px; }
  .faq { margin-top: 50px; display: grid; gap: 34px; }
  .faq div { border-top: 3px solid rgb(255 255 255 / 0.25); padding-top: 26px; }
  .faq dt { font: 700 48px/1.15 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
  .faq dd { font: 500 40px/1.3 'Barlow', sans-serif; margin-top: 8px; opacity: 0.8; }
  .contacto { position: absolute; left: 90px; right: 90px; bottom: 420px; display: flex; align-items: center; gap: 22px; padding: 30px 36px; border-radius: 34px; background: var(--paper); color: var(--coal); font: 800 54px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.01em; }
  .contacto svg { width: 58px; height: 58px; }
  .contacto small { display: block; font: 600 30px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; opacity: 0.6; margin-bottom: 10px; }
  .pie { position: absolute; left: 90px; right: 90px; bottom: 310px; display: flex; justify-content: space-between; align-items: center; }
  .pie .usuario { font: 700 34px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  const M = window.Marca
  const h = (tag, attrs = {}, html = '') => {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v)
    el.innerHTML = html
    return el
  }
  const pieza = (w, hgt, clase, html) => h('div', { class: `pieza ${clase}`, style: `width:${w}px;height:${hgt}px` }, html)

  /** QR vectorial de un enlace, módulos en carbón y 4 de margen. */
  function qr(texto, lado) {
    const q = qrcode(0, 'M')
    q.addData(texto, 'Byte')
    q.make()
    const n = q.getModuleCount(), t = n + 8
    let d = ''
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`
    return `<svg viewBox="0 0 ${t} ${t}" style="width:${lado}px;height:${lado}px;display:block" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#0f0f0e"/></svg>`
  }
  const iconoEn = (lado, fg, calado) => M.icono(fg, calado).replace('<svg', `<svg style="width:${lado}px;height:${lado}px"`)

  const PIEZAS = {}

  // --- Logos (fondo transparente) ---
  for (const [id, claro] of [['negro', false], ['blanco', true]]) {
    // Recortados al logo con su área de respeto (media altura del ícono por lado).
    PIEZAS[`logo-horizontal-${id}`] = () => h('div', { class: 'pieza transparente', style: 'display:inline-block;padding:130px' }, M.logo({ claro, alto: 260 }))
    PIEZAS[`logo-apilado-${id}`] = () => h('div', { class: 'pieza transparente', style: 'display:inline-block;padding:130px' }, M.logo({ claro, apilado: true, alto: 260 }))
    PIEZAS[`icono-${id}`] = () => pieza(1024, 1024, 'transparente centro', iconoEn(860, claro ? '#ffffff' : '#0f0f0e', claro ? '#0f0f0e' : '#ffffff'))
  }

  // --- Fotos de perfil: el ícono dentro del círculo que recortan Instagram y WhatsApp ---
  const perfil = (lado) => pieza(lado, lado, 'negra centro', iconoEn(lado * 0.5, '#ffffff', '#0f0f0e'))
  PIEZAS['ig-perfil'] = () => perfil(1080)
  PIEZAS['wa-perfil'] = () => perfil(640)

  // --- Portadas de destacadas: ícono lineal blanco, centrado en el círculo ---
  for (const d of M.DESTACADAS) {
    PIEZAS[`destacada-${d.id}`] = () => pieza(1080, 1920, 'negra centro', `<div style="width:440px;height:440px;color:#fff">${M.ICONOS[d.id].replace('<svg', '<svg style="width:100%;height:100%"')}</div>`)
  }

  // --- Historia de contenido de cada destacada ---
  const contacto = () => `<div class="contacto">${M.ICONOS.whatsapp}<div><small>WhatsApp</small>${M.WHATSAPP_VISIBLE}</div></div>`
  for (const d of M.DESTACADAS) {
    PIEZAS[`historia-${d.id}`] = () => {
      let html = `<p class="kicker">${d.kicker}</p><div class="grande">${d.titulo.join('<br>')}</div><i class="regla"></i>`
      if (d.texto) html += `<p class="texto">${d.texto}</p>`
      if (d.puntos) html += `<ul class="lista">${d.puntos.map((p, i) => `<li><b>${d.id === 'como' ? i + 1 : '✓'}</b><span>${p}</span></li>`).join('')}</ul>`
      if (d.faq) html += `<dl class="faq">${d.faq.map(([q, a]) => `<div><dt>${q}</dt><dd>${a}</dd></div>`).join('')}</dl>`
      if (d.contacto) html += contacto()
      html += `<div class="pie">${M.logo({ claro: true, alto: 50 })}<span class="usuario">@${M.INSTAGRAM}</span></div>`
      return pieza(1080, 1920, 'negra historia', html)
    }
  }

  // --- WhatsApp Business: portada del perfil (se ve recortada al centro) ---
  PIEZAS['wa-portada'] = () => pieza(1920, 1080, 'negra centro', `
    <div style="text-align:center">
      <div class="cond" style="font-size:170px;line-height:0.86">Tu agenda,<br>sin libreta.</div>
      <p style="font:600 44px/1 'Barlow Condensed',sans-serif;letter-spacing:0.16em;text-transform:uppercase;opacity:.6;margin-top:50px">Reservas online · 1 mes gratis · ${M.WEB}</p>
    </div>`)

  // --- Catálogo de WhatsApp (1:1) ---
  const tarjetaCat = (fondo, kicker, titulo, cuerpo) => pieza(1080, 1080, fondo, `
    <div style="position:absolute;inset:90px;display:flex;flex-direction:column">
      <p class="kicker" style="font-size:36px">${kicker}</p>
      <div class="cond" style="font-size:150px;line-height:0.88;margin-top:26px">${titulo}</div>
      <div style="margin-top:auto">${cuerpo}</div>
    </div>`)
  const lineas = (items) => `<ul class="lista" style="margin:0;gap:18px">${items.map((t) => `<li style="font-size:40px"><b style="width:46px;height:46px;font-size:26px">✓</b><span>${t}</span></li>`).join('')}</ul>`
  PIEZAS['catalogo-plan'] = () => tarjetaCat('negra', 'Plan Pro', '$10<span style="font-size:70px"> /mes</span><br><span style="font-size:90px">1 mes gratis</span>',
    lineas(['Tu página con tu logo y colores', 'Reservas 24/7 en Google Calendar', 'Pago Móvil y comprobante de cita', 'Sin contrato']) + `<div style="margin-top:46px">${M.logo({ claro: true, alto: 46 })}</div>`)
  PIEZAS['catalogo-como'] = () => tarjetaCat('blanca', 'Cómo funciona', 'En 3<br>pasos.',
    `<ul class="lista" style="margin:0;gap:18px">${M.DESTACADAS[0].puntos.map((p, i) => `<li style="font-size:40px"><b style="width:46px;height:46px;font-size:28px">${i + 1}</b><span>${p}</span></li>`).join('')}</ul><div style="margin-top:46px">${M.logo({ alto: 46 })}</div>`)
  PIEZAS['catalogo-qr'] = () => tarjetaCat('negra', 'Incluido', 'Tu QR<br>para el local.',
    `<div style="display:flex;gap:44px;align-items:flex-end"><div style="background:#fff;border-radius:30px;padding:18px">${qr(M.ENLACES.demo, 250)}</div><p style="font:500 38px/1.3 Barlow;opacity:.85">Lo generas con tus colores desde tu hoja y lo imprimes para el mostrador.</p></div>`)

  // --- QR de WhatsApp con el mensaje ya escrito ---
  const qrWa = (kicker, titulo, enlace) => pieza(1080, 1350, 'blanca', `
    <div style="position:absolute;inset:100px 90px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <p class="kicker" style="font-size:36px">${kicker}</p>
      <div class="cond" style="font-size:118px;line-height:0.9;margin-top:22px">${titulo}</div>
      <div style="margin-top:56px;border:6px solid #0f0f0e;border-radius:40px;padding:22px">${qr(enlace, 520)}</div>
      <div style="margin-top:auto;display:flex;align-items:center;gap:16px;font:800 50px/1 'Barlow Condensed',sans-serif"><span style="width:50px;height:50px;display:block">${M.ICONOS.whatsapp.replace('<svg', '<svg style="width:100%;height:100%"')}</span>${M.WHATSAPP_VISIBLE}</div>
    </div>`)
  PIEZAS['qr-afiliar'] = () => qrWa('Escanea y escríbenos', 'Afilia tu<br>negocio', M.ENLACES.afiliar)
  PIEZAS['qr-soporte'] = () => qrWa('Clientes bookeaa', 'Soporte por<br>WhatsApp', M.ENLACES.soporte)

  // ?p=id dibuja una sola pieza (para el render); sin nada, todas en miniatura.
  const q = new URLSearchParams(location.search)
  const raiz = document.getElementById('raiz')
  if (q.has('p')) raiz.appendChild(PIEZAS[q.get('p')]())
  else {
    document.body.classList.add('preview')
    for (const [id, f] of Object.entries(PIEZAS)) raiz.appendChild(f()).title = id
  }
  window.PIEZAS_IDS = Object.keys(PIEZAS)
  window.SVGS = {
    'icono-negro': M.icono('#0f0f0e', '#ffffff'),
    'icono-blanco': M.icono('#ffffff', '#0f0f0e'),
    ...Object.fromEntries(M.DESTACADAS.map((d) => [`destacada-${d.id}`, M.ICONOS[d.id]])),
  }
  window.listo = document.fonts.ready
</script>
</body>
</html>
