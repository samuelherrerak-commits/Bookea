# Despliega el bot de WhatsApp (bot/) en Cloudflare Workers.
# Corre al fusionar en main algo que toque bot/, o a mano desde la pestaña Actions.
# Secretos de GitHub que necesita (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   WA_TOKEN, WA_PHONE_ID, WA_WABA_ID, APP_SECRET, VERIFY_TOKEN, BANDEJA_CLAVE, APPS_SCRIPT_URL, BOT_TOKEN
name: Bot de WhatsApp

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

concurrency: bot-deploy

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del bot
        run: npx vitest run bot && npx tsc -p bot

      - name: Base de datos D1 (se crea la primera vez)
        working-directory: bot
        run: |
          buscar() { npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='bookeaa-bot');process.stdout.write(d?d.uuid:'')"; }
          ID=$(buscar)
          if [ -z "$ID" ]; then npx wrangler d1 create bookeaa-bot >/dev/null; ID=$(buscar); fi
          test -n "$ID"
          sed -i "s/REEMPLAZAR_CON_EL_ID_DE_D1/$ID/" wrangler.toml
          npx wrangler d1 migrations apply bookeaa-bot --remote

      - name: Desplegar
        working-directory: bot
        run: npx wrangler deploy

      - name: Secretos del Worker
        working-directory: bot
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_WABA_ID: ${{ secrets.WA_WABA_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
          BANDEJA_CLAVE: ${{ secrets.BANDEJA_CLAVE }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          node -e "
            const k=['WA_TOKEN','WA_PHONE_ID','WA_WABA_ID','APP_SECRET','VERIFY_TOKEN','BANDEJA_CLAVE','APPS_SCRIPT_URL','BOT_TOKEN'];
            const o={}; for (const n of k) if (process.env[n]) o[n]=process.env[n];
            const faltan=k.filter(n=>!o[n]); if (faltan.length) console.log('Faltan en GitHub: '+faltan.join(', '));
            require('fs').writeFileSync('secretos.json', JSON.stringify(o));"
          npx wrangler secret bulk secretos.json
          rm -f secretos.json
