<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="description" content="bookeaa: agenda online para negocios. Tus clientes reservan desde tu link y la cita queda en Google Calendar. 1 mes gratis, luego $10/mes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Agregar a inicio: abre como app (sin la barra del navegador). La página de un
         negocio cambia el manifest por uno propio (src/lib/pwa.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="bookeaa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- El catálogo llega de Apps Script: Abre la conexión TLS antes de que React monte. -->
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <title>bookeaa · Tu agenda online, sin libreta</title>
    <!--
      Pide el catálogo del negocio apenas llega el HTML, en paralelo con el JS de la
      app (que antes esperaba a que React montara). api.ts toma esta respuesta en su
      primer pedido. Vite reemplaza las %VITE_…% en el build; el CSP lo arma
      vite.config.ts con el hash de este script.
    -->
    <script>
      ;(function () {
        var url = '%VITE_API_URL%', token = '%VITE_API_TOKEN%'
        if (!/^https?:\/\//.test(url) || !token || token.charAt(0) === '%') return
        var m = /^\/u\/([^/]+)\/?$/.exec(location.pathname)
        var slug = m ? m[1] : new URLSearchParams(location.search).get('shop')
        slug = String(slug || '').trim().toLowerCase()
        if (!slug) return
        try {
          var u = new URL(url)
          u.searchParams.set('token', token)
          u.searchParams.set('shop', slug)
          window.__catalogoTemprano = { url: u.toString(), respuesta: fetch(u.toString(), { redirect: 'follow' }) }
          window.__catalogoTemprano.respuesta.catch(function () {})
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
